services:
  - type: web
    name: mahindra-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.in
      - key: ZOHO_API_URL
        value: https://www.zohoapis.in
      - key: SERVICE_MODULE_API_NAME
        value: Cases
      - key: ASSISTANT_NAME
        value: Automotive AI Assistant
